<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography - Prithwiraj Das</title>
    <meta name="description" content="Photographs by Prithwiraj Das.">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/photoswipe/photoswipe.css">
    <link rel="stylesheet" href="gallery.css">
    <script>
        // Applied before paint so the page never flashes light before going dark.
        (function(){var s=localStorage.getItem('theme');if(s){document.documentElement.setAttribute('data-theme',s)}else if(window.matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.setAttribute('data-theme','dark')}})();
    </script>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="../" class="nav-name">Prithwiraj Das</a>
        <div class="nav-links">
            <a href="../">Back to site</a>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">&#9788;</button>
        </div>
    </div>
</nav>

<main class="page">
    <h1 class="page-title">Photography</h1>
    <div class="grid" id="grid"></div>
</main>

<footer>
    <p>&#169; 2026 Prithwiraj Das</p>
</footer>

<script>
function toggleTheme(){var h=document.documentElement,c=h.getAttribute('data-theme'),n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.querySelector('.theme-toggle').innerHTML=n==='dark'?'&#9790;':'&#9788;'}
(function(){if(document.documentElement.getAttribute('data-theme')==='dark')document.querySelector('.theme-toggle').innerHTML='&#9790;'})();
</script>
<script type="module" src="gallery.js"></script>

</body>
</html>
